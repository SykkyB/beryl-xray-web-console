# xray-panel-cli config. Copy to /etc/xray-panel-cli/panel.yaml on the
# router and edit. The panel reads this file on startup; it does not
# modify it.

# Listen address. On stock GL.iNet firmware fw3 already drops WAN-side
# traffic to non-allowed ports (zone_wan_src_DROP catches everything),
# so binding to 0.0.0.0 is safe in practice and avoids a kernel-routing
# quirk on this hardware where binding to a specific LAN IP causes
# SYN-ACK replies to leave via lo and never reach the LAN client.
# Override with the LAN IP if you know your firewall posture is custom.
listen: "0.0.0.0:9092"

# Paths on the router. Defaults match the layout this repo deploys to.
sing_box_config: /etc/sing-box/config.json
sing_box_bin:    /usr/bin/sing-box
sing_box_init:   /etc/init.d/sing-box
sing_box_log:    /var/log/sing-box.log
profiles_store:  /etc/xray-panel-cli/profiles.json

# clash-API endpoint exposed by sing-box (experimental.clash_api in
# config.json). The panel proxies live data through it: traffic counters,
# active connections, latency tests. Default sing-box config in this
# repo binds to 127.0.0.1:9090.
clash_api: "127.0.0.1:9090"

auth:
  username: admin
  # Generate with:  htpasswd -nbBC 12 admin 'yourpassword' | cut -d: -f2
  # or:             python3 -c 'import bcrypt; print(bcrypt.hashpw(b"yourpassword", bcrypt.gensalt()).decode())'
  # If you also run the flint2 panel, you can paste the same hash to
  # share credentials between the two consoles.
  password_bcrypt: "$2a$12$REPLACE_ME_WITH_A_REAL_BCRYPT_HASH_XXXXXXXXXXXXXXXXXXXXX"

# /www/xray-panel-launcher.js (injected into the GL.iNet stock admin UI)
# reads this on every page load via GET /api/launcher-config and gates
# its DOM mutations accordingly. Switching modes = edit + restart panel.
#
#   legacy    — sidebar entry + home-page topology icon recolor (safe default).
#   dashboard — legacy + an XRAY tunnel card injected into the stock
#               VPN Dashboard (profile picker + ON/OFF toggle). Killswitch
#               toggle still lives on this panel at :9092.
#   full      — not implemented yet; falls back to dashboard.
#
# Rollback to legacy if anything renders badly: change to "legacy" here,
# `/etc/init.d/xray-panel-cli restart`, refresh the browser.
injection:
  mode: legacy
